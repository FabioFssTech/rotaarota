<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotas RJ Premium</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<link rel="stylesheet" href="style.css">
</head>

<body>

<aside class="sidebar">

<div class="logo">
🗺️ Rotas RJ Premium
</div>

<div class="form-group">
<label>Origem</label>
<input
type="text"
id="origem"
placeholder="Ex: Copacabana">
</div>

<div class="form-group">
<label>Destino</label>
<input
type="text"
id="destino"
placeholder="Ex: Cristo Redentor">
</div>

<div class="form-group">
<label>Modo de Transporte</label>

<select id="modo">
<option value="car">🚗 Carro</option>
<option value="bus">🚌 Ônibus</option>
<option value="foot">🚶 A pé</option>
<option value="bike">🚴 Bicicleta</option>
</select>
</div>

<div class="buttons">

<button onclick="usarLocalizacao()">
📍 Minha Localização
</button>

<button onclick="calcularRota()">
🚀 Calcular Rota
</button>

</div>

<div class="info">

<h3>Informações da Viagem</h3>

<p id="distancia">
Distância: --
</p>

<div class="card-transporte">
<h4>🚗 Carro</h4>
<p id="tempoCarro">--</p>
</div>

<div class="card-transporte">
<h4>🚌 Ônibus</h4>
<p id="tempoOnibus">--</p>
</div>

<div class="card-transporte">
<h4>🚶 A Pé</h4>
<p id="tempoPe">--</p>
</div>

<div class="card-transporte">
<h4>🚴 Bicicleta</h4>
<p id="tempoBike">--</p>
</div>

</div>

<div class="onibus-box">
<h3>🚌 Linhas Sugeridas</h3>

<ul id="linhasOnibus">
<li>Calcule uma rota...</li>
</ul>
</div>

<div class="historico">

<h3>📌 Histórico</h3>

<ul id="listaHistorico"></ul>

</div>

</aside>

<main id="map"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script src="script.js"></script>

</body>

</html>
``
