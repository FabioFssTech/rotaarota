<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotas RJ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="sidebar">

<h1>🗺️ Rotas RJ</h1>

<input
type="text"
id="origem"
placeholder="Origem (Endereço ou CEP)">

<input
type="text"
id="destino"
placeholder="Destino (Endereço ou CEP)">

<div class="buttons">

<button onclick="usarLocalizacao()">
📍 Minha Localização
</button>

<button onclick="calcularRota()">
🚗 Calcular Rota
</button>

</div>

<div class="card">

<h3>Informações da Rota</h3>

<p id="distancia">
Distância: --
</p>

<p id="tempo">
Tempo: --
</p>

</div>

<div class="card">

<h3>Últimas Pesquisas</h3>

<ul id="historico"></ul>

</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script src="script.js"></script>

</body>
</html>
